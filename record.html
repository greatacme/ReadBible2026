<!DOCTYPE html>
<html lang="ko" style="font-size: 120%">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
  <title>성경통독 기록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    .focus-row {
      animation: highlight 2s ease-out forwards;
    }
    @keyframes highlight {
      0%   { background-color: #fef9c3; }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="bg-blue-900 text-white px-4 py-3 flex items-center gap-3 shadow-lg sticky top-0 z-10">
    <button onclick="location.href='index.html?group=' + encodeURIComponent(groupCode) + '&ministry=' + encodeURIComponent(ministryCode)" class="text-blue-300 hover:text-white text-xl leading-none">←</button>
    <div class="flex-1 min-w-0">
      <h1 id="userName" class="text-base font-bold truncate">성경통독 기록</h1>
      <p id="userRate" class="text-blue-300 text-xs"></p>
    </div>
    <div id="saveIndicator" class="text-xs text-green-300 opacity-0 transition-opacity duration-500 whitespace-nowrap">
      저장됨 ✓
    </div>
    <button onclick="location.href='edit.html?nickname=' + encodeURIComponent(nickname) + groupParam"
      class="text-blue-300 hover:text-white text-sm whitespace-nowrap ml-1">설정</button>
  </header>

    <!-- 완독 축하 모달 -->
  <div id="congratsModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-sm w-full text-center space-y-4 transform transition-all animate-bounce-once">
      <div class="text-5xl">🎊</div>
      <h3 id="congratsTitle" class="text-xl font-bold text-gray-800">축하합니다! 완독하셨습니다.</h3>
      <p id="congratsDesc" class="text-sm text-gray-600 leading-relaxed"></p>
      <button onclick="closeCongratsModal()"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-xl text-sm shadow-md transition">
        은혜를 기억하며 확인
      </button>
    </div>
  </div>

  <main class="max-w-2xl mx-auto p-4">
    <div id="content">
      <p class="text-gray-400 text-center py-10">불러오는 중...</p>
    </div>
  </main>

  <script>
    const { createClient } = supabase
    const sb = createClient(
      'https://wwnohpprdjnvdjccednr.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3bm9ocHByZGpudmRqY2NlZG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MTY1NzYsImV4cCI6MjA4OTM5MjU3Nn0.GYpMk0VTi4lSsrWtiqeW5AZ3BulCUv3lg13_VBJeyd4'
    )

    const params       = new URLSearchParams(location.search)
    const nickname     = params.get('nickname')
    const groupCode    = params.get('group')
    const ministryCode = params.get('ministry') || '0'
    const testament    = params.get('testament') || localStorage.getItem('readbible_tab') || 'ALL'
    if (!nickname || !groupCode) location.href = `index.html?group=${encodeURIComponent(groupCode || '')}&ministry=${encodeURIComponent(ministryCode)}`
    const groupParam = `&group=${encodeURIComponent(groupCode)}&ministry=${encodeURIComponent(ministryCode)}&testament=${testament}`
    const fontSizeKey = `readbible_font_size:${groupCode}:${ministryCode}:${nickname}`

    // 그룹/미니스트리 존재 여부 검증
    async function validateGroup() {
      const { data: grp } = await sb.from('groups').select('group_code')
        .eq('group_code', groupCode).eq('ministry_cd', ministryCode).maybeSingle()
      if (!grp) location.href = `index.html?group=${encodeURIComponent(groupCode)}&ministry=${encodeURIComponent(ministryCode)}`
    }
    validateGroup()

    const DAYS = ['일', '월', '화', '수', '목', '금', '토']
    const today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date())

    let userId     = null
    let allRecords = []   // { plan_id, date, book, chapter_no, completed }
    let saveTimer  = null

    function applyFontSize(value) {
      const fontSizePct = Math.min(180, Math.max(80, Number(value) || 120))
      document.documentElement.style.fontSize = `${fontSizePct}%`
    }

    // ── 필터링된 기록 조회 ─────────────────────────────────────────────
    function getFilteredRecords() {
      if (testament === 'OT') return allRecords.filter(r => r.testament === 'OT')
      if (testament === 'NT') return allRecords.filter(r => r.testament === 'NT')
      return allRecords
    }

    // ── 통계 표시 ──────────────────────────────────────────────────────
    function updateRateDisplay() {
      const records = getFilteredRecords()
      const planned   = records.filter(r => r.date <= today).length
      const completed = records.filter(r => r.completed).length
      const rate = planned > 0 ? (completed / planned * 100).toFixed(1) : '0.0'
      const labelMap = { 'ALL': '전체', 'OT': '구약', 'NT': '신약' }
      const tabLabel = labelMap[testament] || '전체'
      document.getElementById('userRate').textContent =
        `[${tabLabel}] 완료율 ${rate}% · ${completed}/${planned}장`
    }

    // ── 날짜 포맷 ─────────────────────────────────────────────────────
    function fmtDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00')
      return `${d.getMonth() + 1}/${d.getDate()}(${DAYS[d.getDay()]})`
    }

    // ── 렌더링 ────────────────────────────────────────────────────────
    function render() {
      const records = getFilteredRecords()
      if (records.length === 0) {
        document.getElementById('content').innerHTML =
          '<p class="text-gray-400 text-center py-10">해당 구분의 성경 일정이 없습니다.</p>'
        return
      }

      const months = {}
      for (const r of records) {
        const ym = r.date.slice(0, 7)
        ;(months[ym] = months[ym] || []).push(r)
      }

      document.getElementById('content').innerHTML =
        Object.entries(months).map(([ym, items]) => {
          const [y, m]    = ym.split('-')
          const monthDone = items.filter(i => i.completed).length
          const allDone   = monthDone === items.length

          const byDate = {}
          for (const r of items) (byDate[r.date] = byDate[r.date] || []).push(r)

          const datesHtml = Object.entries(byDate).map(([dt, chapters]) => {
            const dateDone   = chapters.filter(c => c.completed).length
            const dayAllDone = dateDone === chapters.length
            return `
            <div class="border-b last:border-0">
              <div class="flex items-center gap-2 px-4 py-1.5 bg-slate-50">
                <span class="text-xs font-semibold w-24 flex-shrink-0
                             ${dayAllDone ? 'text-green-600' : 'text-gray-500'}">
                  ${fmtDate(dt)}
                </span>
                <span class="text-xs text-gray-400">${dateDone}/${chapters.length}장</span>
                ${dayAllDone ? '<span class="text-green-500 text-xs ml-1">✓</span>' : ''}
              </div>
              ${chapters.map(ch => `
              <div class="flex items-center gap-3 px-4 py-2 hover:bg-slate-50 transition"
                   id="row-${ch.plan_id}">
                <input type="checkbox" id="chk-${ch.plan_id}"
                  ${ch.completed ? 'checked' : ''}
                  onchange="save(${ch.plan_id}, this.checked)"
                  class="w-4 h-4 accent-blue-700 cursor-pointer flex-shrink-0"/>
                <label for="chk-${ch.plan_id}"
                  class="text-sm cursor-pointer select-none
                         ${ch.completed ? 'text-gray-400 line-through' : 'text-gray-800'}">
                  ${ch.book} ${ch.chapter_no}장
                </label>
                <a href="bible.html?nickname=${encodeURIComponent(nickname)}&plan_id=${ch.plan_id}&book=${encodeURIComponent(ch.book)}&chapter_no=${ch.chapter_no}&sort_order=${ch.sort_order}${groupParam}"
                   class="ml-auto text-blue-400 hover:text-blue-600 text-base flex-shrink-0" title="성경 읽기">📖</a>
              </div>`).join('')}
            </div>`
          }).join('')

          return `
          <div class="bg-white rounded-2xl shadow mb-4 overflow-hidden">
            <button onclick="toggleMonth('${ym}')"
              class="w-full flex items-center justify-between px-4 py-3 bg-gray-50 hover:brightness-95 transition">
              <span class="font-semibold text-gray-700">${y}년 ${parseInt(m)}월</span>
              <span class="text-xs font-semibold ${allDone ? 'text-green-600' : 'text-gray-400'}">
                ${monthDone}/${items.length}장 완료
              </span>
            </button>
            <div id="month-${ym}" class="hidden">${datesHtml}</div>
          </div>`
        }).join('')
    }

    // ── 월 토글 ───────────────────────────────────────────────────────
    function toggleMonth(ym) {
      document.getElementById(`month-${ym}`).classList.toggle('hidden')
    }

    // ── 포커스: 첫 미완료 장의 월 펼치고 스크롤 ──────────────────────
    function focusFirstUnchecked() {
      const records = getFilteredRecords()
      const target = records.find(r => !r.completed)
      const ym     = target ? target.date.slice(0, 7) : today.slice(0, 7)

      const monthDiv = document.getElementById(`month-${ym}`)
      if (monthDiv) monthDiv.classList.remove('hidden')

      if (!target) return

      setTimeout(() => {
        const row = document.getElementById(`row-${target.plan_id}`)
        if (!row) return
        const headerH = document.querySelector('header').offsetHeight
        const absTop  = row.getBoundingClientRect().top + window.scrollY
        window.scrollTo({ top: absTop - headerH - 12, behavior: 'smooth' })
        row.classList.add('focus-row')
      }, 50)
    }

    // ── 완독 축하 폭죽 & 모달 ──────────────────────────────────────────
    function launchFireworks() {
      if (typeof confetti !== 'function') return
      const duration = 5 * 1000 // 5초 동안 지속
      const animationEnd = Date.now() + duration
      const defaults = { startVelocity: 28, spread: 360, ticks: 120, gravity: 0.6, decay: 0.94, zIndex: 9999 }

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now()
        if (timeLeft <= 0) {
          return clearInterval(interval)
        }
        const particleCount = 40 * (timeLeft / duration)
        // 화면 좌/우/중앙에서 천천히 우아하게 퍼지는 연출
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 } }))
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 } }))
      }, 250)
    }

    function showCongratsModal(type) {
      launchFireworks()
      const titleEl = document.getElementById('congratsTitle')
      const descEl = document.getElementById('congratsDesc')
      const modal = document.getElementById('congratsModal')

      if (type === 'ALL') {
        titleEl.textContent = '축하합니다! 성경 66권 전체 완독!'
        descEl.innerHTML = `<strong>${nickname}</strong>님, 창세기부터 요한계시록까지<br/>하나님의 말씀을 온전히 완독하셨습니다! ✝`
      } else if (type === 'OT') {
        titleEl.textContent = '축하합니다! 구약 완독!'
        descEl.innerHTML = `<strong>${nickname}</strong>님, 구약 성경 39권(929장)을<br/>모두 완독하셨습니다! 📜`
      } else if (type === 'NT') {
        titleEl.textContent = '축하합니다! 신약 완독!'
        descEl.innerHTML = `<strong>${nickname}</strong>님, 신약 성경 27권(260장)을<br/>모두 완독하셨습니다! 📖`
      }
      modal.classList.remove('hidden')
    }

    function closeCongratsModal() {
      document.getElementById('congratsModal').classList.add('hidden')
    }

    function checkMilestone(prevOTUnread, prevNTUnread, prevTotalUnread) {
      const curOTUnread = allRecords.filter(r => r.testament === 'OT' && !r.completed).length
      const curNTUnread = allRecords.filter(r => r.testament === 'NT' && !r.completed).length
      const curTotalUnread = allRecords.filter(r => !r.completed).length

      // 전체 완독 달성 시점
      if (prevTotalUnread > 0 && curTotalUnread === 0) {
        showCongratsModal('ALL')
        return
      }
      // 구약 완독 달성 시점
      if (prevOTUnread > 0 && curOTUnread === 0) {
        showCongratsModal('OT')
        return
      }
      // 신약 완독 달성 시점
      if (prevNTUnread > 0 && curNTUnread === 0) {
        showCongratsModal('NT')
        return
      }
    }

    // ── 저장 ──────────────────────────────────────────────────────────
    async function save(planId, completed) {
      const prevOTUnread = allRecords.filter(r => r.testament === 'OT' && !r.completed).length
      const prevNTUnread = allRecords.filter(r => r.testament === 'NT' && !r.completed).length
      const prevTotalUnread = allRecords.filter(r => !r.completed).length

      const rec = allRecords.find(r => r.plan_id === planId)
      if (rec) rec.completed = completed
      updateRateDisplay()

      if (completed) {
        checkMilestone(prevOTUnread, prevNTUnread, prevTotalUnread)
      }

      const label = document.querySelector(`label[for="chk-${planId}"]`)
      if (label) {
        label.classList.toggle('text-gray-400', completed)
        label.classList.toggle('line-through',  completed)
        label.classList.toggle('text-gray-800', !completed)
      }

      await sb.from('records').upsert(
        { user_id: userId, plan_id: planId, completed, updated_at: new Date().toISOString() },
        { onConflict: 'user_id,plan_id' }
      )

      const ind = document.getElementById('saveIndicator')
      ind.style.opacity = '1'
      clearTimeout(saveTimer)
      saveTimer = setTimeout(() => { ind.style.opacity = '0' }, 2000)
    }

    // ── 데이터 로드 ───────────────────────────────────────────────────
    async function loadRecords() {
      // 1. 사용자 조회 + groups 조회 병렬
      let [{ data: user }, { data: grp }] = await Promise.all([
        sb.from('users').select('id').eq('nickname', nickname).eq('group_code', groupCode).maybeSingle(),
        sb.from('groups').select('plan_set_cd').eq('group_code', groupCode).eq('ministry_cd', ministryCode).maybeSingle()
      ])
      if (!user) {
        if (!confirm(`'${nickname}'(으)로 신규 등록하시겠습니까?`)) {
          location.href = `index.html?group=${encodeURIComponent(groupCode)}&ministry=${encodeURIComponent(ministryCode)}`
          return
        }
        const { data: newUser, error } = await sb.from('users').insert({ nickname, group_code: groupCode }).select('id').single()
        if (error) { location.href = `index.html?group=${encodeURIComponent(groupCode)}&ministry=${encodeURIComponent(ministryCode)}`; return }
        user = newUser
      }
      userId = user.id
      applyFontSize(localStorage.getItem(fontSizeKey) || 120)
      const planSetCd = grp?.plan_set_cd ?? '1'

      // 2. 계획 조회 + 완료 기록 조회 + book(구약/신약 구분) 병렬
      const [{ data: plans }, { data: records }, { data: books }] = await Promise.all([
        sb.from('plans').select('id, date, book, chapter_no, sort_order')
          .eq('plan_set_cd', planSetCd).order('sort_order').limit(1500),
        sb.from('records').select('plan_id, completed').eq('user_id', userId),
        sb.from('book').select('name_ko, testament')
      ])
      const recMap = Object.fromEntries((records || []).map(r => [r.plan_id, r.completed]))
      const bookTestamentMap = Object.fromEntries((books || []).map(b => [b.name_ko, b.testament]))

      // 3. 병합
      allRecords = (plans || []).map(p => ({
        plan_id:    p.id,
        date:       p.date,
        book:       p.book,
        chapter_no: p.chapter_no,
        sort_order: p.sort_order,
        completed:  recMap[p.id] ?? false,
        testament:  bookTestamentMap[p.book] || 'OT'
      }))

      document.getElementById('userName').textContent = `${nickname}님의 성경통독`
      updateRateDisplay()
      render()
      focusFirstUnchecked()
    }

    loadRecords()
  </script>
</body>
</html>
